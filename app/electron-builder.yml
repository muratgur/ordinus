appId: com.muratgur.ordinus
productName: Ordinus
copyright: Copyright (c) 2026 Murat Gür
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# ADR-047: download + verify the matching standalone Node binary into
# resources/runtime/node for each target before packing. The extraResources
# entry below then ships it; afterPack asserts it actually got bundled
# (electron-builder silently skips a missing extraResources source).
beforePack: scripts/before-pack-node.cjs
afterPack: scripts/after-pack-node.cjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # npm spawns subprocesses and reads scripts from disk, which cannot be
  # served from inside an asar archive. ADR-028's managed install service
  # runs `npm install` via this dependency, so it must live unpacked on
  # the real filesystem.
  - node_modules/npm/**
extraResources:
  # ADR-047: the standalone Node runtime, downloaded per-target by the beforePack
  # hook above. Must live unpacked on the real filesystem (it's an executable the
  # CLIs and npm resolve via PATH), so it ships as an extra resource, not in asar.
  - from: resources/runtime/node
    to: runtime/node
  - from: resources/db/migrations
    to: db/migrations
  - from: resources/profiles
    to: profiles
  - from: resources/ordinus-knowledge
    to: ordinus-knowledge
  # ADR-042: self-contained WhatsApp MCP sub-package — its node_modules ship
  # as-is (pure JS, no native modules) so the electron-node child can run it
  # from process.resourcesPath without any install step.
  - from: resources/whatsapp-mcp
    to: whatsapp-mcp
    filter:
      - '**/*'
      - '!poc-auth/**'
  # ADR-043: self-contained Google Workspace MCP sub-package — pure JS (raw
  # fetch, no native modules), ships with its node_modules to run from
  # process.resourcesPath without an install step.
  - from: resources/google-mcp
    to: google-mcp
    filter:
      - '**/*'
      - '!poc.mjs'
  # ADR-046: self-contained X (Twitter) MCP sub-package — pure JS (raw fetch to
  # X API v2, no native modules), ships with its node_modules to run from
  # process.resourcesPath without an install step.
  - from: resources/x-mcp
    to: x-mcp
    filter:
      - '**/*'
      - '!_phase0-poc.mjs'
win:
  executableName: ordinus
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
